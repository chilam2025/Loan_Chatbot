[project]
name = "abc-credit-loan-chatbot"
version = "0.1.0"
description = "Predictive loan-decision pipeline and conversational application for ABC Credit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "seaborn>=0.13",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.3",
    "ruff>=0.9",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
phase-a = "abc_credit.phase_a:main"
prepare-data = "abc_credit.preprocessing:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abc_credit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

