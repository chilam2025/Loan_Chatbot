[project]
name = "abc-credit-loan-chatbot"
version = "0.1.0"
description = "Predictive loan-decision pipeline and conversational application for ABC Credit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
phase-a = "abc_credit.phase_a:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abc_credit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

