<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f2" />
    <title>ABC Credit | Vehicle loan application</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="ABC Credit home"><span class="brand-mark" aria-hidden="true">A</span><span>ABC Credit</span></a>
        <label class="language-picker"><span class="sr-only" id="language-label">Language</span><select id="language" aria-labelledby="language-label"><option value="en">English</option><option value="hi">हिन्दी</option></select></label>
      </header>
      <section class="application" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow" id="eyebrow">VEHICLE LOAN</p>
          <h1 id="page-title">A few details to get started</h1>
          <p class="intro-copy" id="intro-copy">Answer a few questions at your own pace. You can review your details before submitting.</p>
        </div>
        <div class="progress-wrap"><div class="progress-meta"><span id="progress-label">Getting started</span><span id="progress-count">0%</span></div><div class="progress-track" role="progressbar" aria-label="Application progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-value"></div></div></div>
        <section class="chat-card" aria-label="Loan application conversation">
          <div id="messages" class="messages" aria-live="polite" aria-relevant="additions text"></div>
          <form id="response-form" class="response-form" novalidate></form>
          <div class="chat-footer"><span class="secure-icon" aria-hidden="true">◈</span><span id="privacy-note">Your information is handled securely.</span></div>
        </section>
        <p class="prototype-note" id="prototype-note">Academic prototype. Verification steps shown here are simulations.</p>
      </section>
    </main>
  </body>
</html>
